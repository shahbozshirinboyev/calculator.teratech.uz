<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIO Calculator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f8;
        --panel: #ffffff;
        --line: #d9e0e5;
        --text: #172026;
        --muted: #60707c;
        --accent: #0f766e;
        --accent-dark: #0a5f59;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .shell {
        width: min(1180px, calc(100% - 32px));
        margin: 24px auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

.rate-bar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    width: 100%;
}

.save_button{
  width: 100%;
  margin-left: 10px;
  margin-right: 10px;
}

      input[type="number"] {
        width: 100%;
        min-height: 42px;
        border: 1px solid #bfccd4;
        border-radius: 6px;
        padding: 9px 10px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      .rate-status {
        min-height: 20px;
        font-size: 13px;
        font-weight: 700;
        color: var(--accent-dark);
      }
      .chegirma_input{
        display: flex;
        flex-direction: column;
      }

      .rate-status.error {
        color: var(--danger);
      }

      .is-hidden {
        display: none !important;
      }

      .rate-save-btn {
        display: none;
      }

      .rate-save-btn.is-visible {
        display: inline-block;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 34px);
        line-height: 1.1;
      }

      .admin-link {
        color: var(--accent);
        text-decoration: none;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 16px;
        align-items: start;
        margin-top: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 18px;
      }

      .field,
      .group {
        display: grid;
        gap: 7px;
        min-width: 0;
      }

      .full {
        grid-column: 1 / -1;
      }

      .group-grid {
        display: grid;
        gap: 12px;
      }

      .group-grid.ram-grid {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .group-grid.storage-grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      .group-grid.storage-grid.three-cols {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .group-grid.storage-grid.two-cols {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .group-grid.storage-grid.one-col {
        grid-template-columns: 1fr;
      }

      label, legend {
        font-weight: 700;
        font-size: 14px;
      }

      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid #bfccd4;
        border-radius: 6px;
        padding: 9px 10px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      select:disabled {
        background: #eef2f4;
        color: #7b8993;
      }

      .group_inputs{

        border: 1px solid #bfccd4;
        border-radius: 6px;
      }

      .summary {
        position: sticky;
        top: 16px;
        padding: 18px;
      }

      .summary h2 {
        margin: 0 0 14px;
        font-size: 20px;
      }

      .line {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
        font-size: 14px;
      }

      .line span:first-child {
        color: var(--muted);
      }

      .line strong {
        max-width: 210px;
        text-align: right;
        line-height: 1.35;
      }

      .total {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 2px solid var(--text);
      }

      .total strong {
        font-size: 14px;
        color: var(--accent-dark);
        white-space: nowrap;
      }

      .total-uzs {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-top: 8px;
        color: var(--muted);
      }

      .total-uzs strong {
        font-size: 18px;
        color: var(--text);
        white-space: nowrap;
      }

      .actions {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 18px;
      }

      button {
        border: 0;
        border-radius: 6px;
        min-height: 42px;
        padding: 10px 14px;
        cursor: pointer;
        background: var(--accent);
        color: white;
        font-weight: 700;
        font: inherit;
      }

      button.secondary {
        background: #e7ecef;
        color: var(--text);
      }

      .status {
        min-height: 20px;
        margin-top: 12px;
        color: var(--accent-dark);
        font-size: 14px;
        font-weight: 700;
      }

      .status.error {
        color: var(--danger);
      }

      @media (max-width: 860px) {
        .layout,
        .group-grid,
        .group-grid.ram-grid,
        .group-grid.storage-grid,
        .group-grid.storage-grid.three-cols,
        .group-grid.storage-grid.two-cols,
        .group-grid.storage-grid.one-col {
          grid-template-columns: 1fr;
        }

        .summary {
          position: static;
        }
      }
    </style>
  </head>
  <body>

    <main class="shell">

      <div class="topbar">
        <div>
          <h1>AIO Calculator</h1>
        </div>
        <div>
          <a class="admin-link" href="/admin/">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-person-fill-gear" viewBox="0 0 16 16">
              <path d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0m-9 8c0 1 1 1 1 1h5.256A4.5 4.5 0 0 1 8 12.5a4.5 4.5 0 0 1 1.544-3.393Q8.844 9.002 8 9c-5 0-6 3-6 4m9.886-3.54c.18-.613 1.048-.613 1.229 0l.043.148a.64.64 0 0 0 .921.382l.136-.074c.561-.306 1.175.308.87.869l-.075.136a.64.64 0 0 0 .382.92l.149.045c.612.18.612 1.048 0 1.229l-.15.043a.64.64 0 0 0-.38.921l.074.136c.305.561-.309 1.175-.87.87l-.136-.075a.64.64 0 0 0-.92.382l-.045.149c-.18.612-1.048.612-1.229 0l-.043-.15a.64.64 0 0 0-.921-.38l-.136.074c-.561.305-1.175-.309-.87-.87l.075-.136a.64.64 0 0 0-.382-.92l-.148-.045c-.613-.18-.613-1.048 0-1.229l.148-.043a.64.64 0 0 0 .382-.921l-.074-.136c-.306-.561.308-1.175.869-.87l.136.075a.64.64 0 0 0 .92-.382zM14 12.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0"/>
            </svg>
          </a>
        </div>
      </div>


        <div class="rate-bar">

          <div>

            <label for="usd-rate" style="margin-bottom: 2px;">Dollar kursi(so'm):</label>

            <input
              type="number"
              id="usd-rate"
              name="usd_rate"
              min="1"
              step="1"
              data-saved-rate="{% if usd_rate %}{{ usd_rate|floatformat:0 }}{% else %}0{% endif %}"
              {% if usd_rate %}value="{{ usd_rate|floatformat:0 }}"{% endif %}
              placeholder="Masalan: 12850"
            />
        </div>

         <div class="save_button">
          <div class="rate-status" id="rate-status"></div>
          <button type="button" id="save-usd-rate" class="rate-save-btn">
            Saqlash
          </button>
         </div>

          <div class="chegirma_input">

            <label for="discount-percent" style="margin-bottom: 2px;">Chegirma(%):</label>

            <input
              type="number"
              id="discount-percent"
              min="1"
              max="7"
              step="1"
              maxlength="1"
              inputmode="numeric"
              placeholder="0–7"
            />

          </div>

      </div>

      <div class="layout">
        <form class="panel form-grid" id="calculator-form">
          {% csrf_token %}

          <div class="field">
            <label for="monoblock_base">AIO</label>
            <select id="monoblock_base" name="monoblock_base"></select>
          </div>

          <div class="field">
            <label for="cpu">CPU</label>
            <select id="cpu" name="cpu"></select>
          </div>

          <div class="field">
            <label for="ram">RAM</label>
            <select id="ram" name="ram"></select>
          </div>

          <fieldset class="group full group_inputs">
            <legend>SSD/HDD</legend>
            <div class="group-grid storage-grid" id="storage-slots"></div>
          </fieldset>

          <div class="field full">
            <label for="keyboard_mouse">Keyboard and Mouse</label>
            <select id="keyboard_mouse" name="keyboard_mouse"></select>
          </div>
        </form>

        <aside class="panel summary">
          <h2>Hisob-kitob</h2>
          <div class="line">
            <span>AIO</span><strong id="summary-base">-</strong>
          </div>
          <div class="line">
            <span>CPU</span><strong id="summary-cpu">-</strong>
          </div>
          <div class="line">
            <span>RAM</span><strong id="summary-ram">-</strong>
          </div>
          <div class="line">
            <span>SSD / HDD</span><strong id="summary-storage">-</strong>
          </div>
          <div class="line">
            <span>Keyboard / Mouse</span
            ><strong id="summary-keyboard">-</strong>
          </div>
          <div class="line is-hidden" id="summary-discount-wrap">
            <span>Chegirma</span><strong id="summary-discount">-</strong>
          </div>
          <div class="total">
            <strong>Jami(USD):</strong><strong id="summary-total">$0.00</strong>
          </div>

          <div class="total-uzs" id="summary-total-uzs-wrap" hidden>
            <strong>Jami(so'm):</strong>
            <strong id="summary-total-uzs">0 so'm</strong>
          </div>

          <div class="status" id="status"></div>
          <div class="actions">
            <button type="button" id="save-quote">Saqlash</button>
            <button type="button" class="secondary" id="reset-form">Tozalash</button>
          </div>
        </aside>
      </div>
    </main>

    <script id="bases-data" type="application/json">
      {{ base_data|safe }}
    </script>
    <script id="cpus-data" type="application/json">
      {{ cpu_data|safe }}
    </script>
    <script id="rams-data" type="application/json">
      {{ ram_data|safe }}
    </script>
    <script id="storages-data" type="application/json">
      {{ storage_data|safe }}
    </script>
    <script id="keyboard-mouse-data" type="application/json">
      {{ keyboard_mouse_data|safe }}
    </script>
    <script>
      const bases = JSON.parse(
        document.getElementById("bases-data").textContent,
      );
      const cpus = JSON.parse(document.getElementById("cpus-data").textContent);
      const rams = JSON.parse(document.getElementById("rams-data").textContent);
      const storages = JSON.parse(
        document.getElementById("storages-data").textContent,
      );
      const keyboardMouse = JSON.parse(
        document.getElementById("keyboard-mouse-data").textContent,
      );
      const maps = {
        base: new Map(bases.map((item) => [String(item.id), item])),
        cpu: new Map(cpus.map((item) => [String(item.id), item])),
        ram: new Map(rams.map((item) => [String(item.id), item])),
        storage: new Map(storages.map((item) => [String(item.id), item])),
        keyboardMouse: new Map(
          keyboardMouse.map((item) => [String(item.id), item]),
        ),
      };
      const form = document.getElementById("calculator-form");
      const fields = {
        base: document.getElementById("monoblock_base"),
        cpu: document.getElementById("cpu"),
        ram: document.getElementById("ram"),
        keyboardMouse: document.getElementById("keyboard_mouse"),
      };

      const MARKUP_BASE = 10;
      const MIN_MARKUP = 3;
      const MAX_DISCOUNT = 7;
      const MIN_DISCOUNT = 0;
      const discountInput = document.getElementById("discount-percent");

      const usdRateInput = document.getElementById("usd-rate");

      function parseUsdRateValue(raw) {
        const text = String(raw).trim().replace(",", ".");
        if (text === "") {
          return null;
        }
        const rate = Number(text);
        if (!Number.isFinite(rate) || rate <= 0) {
          return null;
        }
        return Math.round(rate);
      }

      function getSavedUsdRate() {
        return parseUsdRateValue(usdRateInput.dataset.savedRate) ?? 0;
      }

      function setSavedUsdRate(rate) {
        const normalized = Math.round(Number(rate)) || 0;
        usdRateInput.dataset.savedRate = String(normalized);
        return normalized;
      }

      function readUsdRate() {
        const raw = usdRateInput.value.trim();
        if (raw === "") {
          return getSavedUsdRate();
        }
        return parseUsdRateValue(raw) ?? getSavedUsdRate();
      }

      function usdRateIsDirty() {
        const saved = getSavedUsdRate();
        const current = parseUsdRateValue(usdRateInput.value);
        if (current === null) {
          return saved !== 0;
        }
        return current !== saved;
      }

      function updateUsdRateSaveVisibility() {
        document
          .getElementById("save-usd-rate")
          .classList.toggle("is-visible", usdRateIsDirty());
      }

      function parseDiscountValue(raw) {
        const text = String(raw).trim();
        if (text === "") {
          return null;
        }
        const discount = Number(text);
        if (
          !Number.isInteger(discount) ||
          discount < MIN_DISCOUNT ||
          discount > MAX_DISCOUNT
        ) {
          return null;
        }
        return discount;
      }

      function readDiscountPercent() {
        const parsed = parseDiscountValue(discountInput.value);
        return parsed ?? 0;
      }

      function sanitizeDiscountInput() {
        const raw = discountInput.value.replace(/\D/g, "").slice(0, 1);
        if (raw === "") {
          discountInput.value = "";
          return;
        }
        const digit = Number(raw);
        if (digit > MAX_DISCOUNT) {
          discountInput.value = String(MAX_DISCOUNT);
        } else {
          discountInput.value = String(digit);
        }
      }

      function updateDiscountSummaryDisplay() {
        const parsed = parseDiscountValue(discountInput.value);
        const discountWrap = document.getElementById("summary-discount-wrap");
        const discountLabel = document.getElementById("summary-discount");
        const showDiscount = parsed !== null && parsed > 0;
        discountWrap.classList.toggle("is-hidden", !showDiscount);
        discountWrap.hidden = !showDiscount;
        discountLabel.textContent = showDiscount ? `${parsed}%` : "-";
      }

      function onDiscountEdited() {
        sanitizeDiscountInput();
        refreshSummary();
      }

      function money(value) {
        return `$${Number(value || 0).toFixed(2)}`;
      }

      function moneyUzs(value) {
        const amount = Math.round(Number(value || 0) * readUsdRate());
        return `${amount.toLocaleString("uz-UZ")} so'm`;
      }

      function effectiveMarkupPercent() {
        const parsed = parseDiscountValue(discountInput.value);
        if (parsed === null || parsed === 0) {
          return MARKUP_BASE;
        }
        return Math.max(MIN_MARKUP, MARKUP_BASE - parsed);
      }

      function finalTotal(subtotal) {
        const markup = effectiveMarkupPercent();
        return subtotal * (1 + markup / 100);
      }

      function selected(select, map) {
        return map.get(select.value) || null;
      }

      function fillOptions(
        select,
        items,
        placeholder = "Tanlang",
        includeEmpty = false,
        autoSelect = true,
      ) {
        const current = select.value;
        select.innerHTML = "";
        select.add(new Option(includeEmpty ? "Tanlanmagan" : placeholder, ""));
        items.forEach((item) => {
          select.add(
            new Option(item.name, item.id),
          );
        });
        if (items.some((item) => String(item.id) === current)) {
          select.value = current;
        } else if (autoSelect && !includeEmpty && items.length) {
          select.value = items[0].id;
        }
        select.disabled = items.length === 0 && !includeEmpty;
      }

      function activeBase() {
        return selected(fields.base, maps.base);
      }

      function activeCpu() {
        return selected(fields.cpu, maps.cpu);
      }

      function createSelect(label, name, items, placeholder) {
        const field = document.createElement("div");
        field.className = "field";
        const labelEl = document.createElement("label");
        labelEl.textContent = label;
        const select = document.createElement("select");
        select.name = name;
        fillOptions(select, items, placeholder, true);
        select.addEventListener("change", refreshSummary);
        field.append(labelEl, select);
        return field;
      }

      function renderRamSelect(base) {
        const compatibleRam = rams.filter(
          (item) => item.ram_type === base.ram_type,
        );
        fillOptions(fields.ram, compatibleRam, "RAM tanlang");
      }

      function renderStorageSlots(base) {
        const container = document.getElementById("storage-slots");
        container.innerHTML = "";
        container.classList.remove("one-col", "two-cols", "three-cols");
        const portCount = base.sata_ports + (base.supports_nvme ? 1 : 0);
        container.classList.add(
          portCount >= 3
            ? "three-cols"
            : portCount === 2
              ? "two-cols"
              : "one-col",
        );
        if (base.supports_nvme) {
          const nvmeItems = storages.filter(
            (item) => item.interface === "nvme",
          );
          container.append(
            createSelect(
              "NVMe port",
              "storage_slots",
              nvmeItems,
              "NVMe tanlang",
            ),
          );
        }
        const sataItems = storages.filter((item) => item.interface === "sata");
        for (let index = 1; index <= base.sata_ports; index += 1) {
          container.append(
            createSelect(
              `SATA port ${index}`,
              "storage_slots",
              sataItems,
              "SSD / HDD tanlang",
            ),
          );
        }
      }

      function refreshForCpu() {
        const cpu = activeCpu();
        if (!cpu) {
          clearSelections();
          return;
        }
        fillOptions(
          fields.base,
          bases.filter((item) => cpu.bases.includes(item.id)),
          "AIO tanlang",
        );
        fillOptions(
          fields.keyboardMouse,
          keyboardMouse,
          "Keyboard / Mouse",
          true,
        );
        const base = activeBase();
        if (base) {
          renderRamSelect(base);
          renderStorageSlots(base);
        }
        refreshSummary();
      }

      function selectedDynamic(name, map) {
        return Array.from(form.querySelectorAll(`select[name="${name}"]`))
          .map((select) => selected(select, map))
          .filter(Boolean);
      }

      function refreshSummary() {
        const base = activeBase();
        const cpu = selected(fields.cpu, maps.cpu);
        const ramItem = selected(fields.ram, maps.ram);
        const storageItems = selectedDynamic("storage_slots", maps.storage);
        const keyboard = selected(fields.keyboardMouse, maps.keyboardMouse);
        const totals = {
          base: base ? base.price : 0,
          cpu: cpu ? cpu.price : 0,
          ram: ramItem ? ramItem.price : 0,
          storage: storageItems.reduce((sum, item) => sum + item.price, 0),
          keyboard: keyboard ? keyboard.price : 0,
        };
        const subtotal = Object.values(totals).reduce(
          (sum, value) => sum + value,
          0,
        );
        const total = finalTotal(subtotal);
        document.getElementById("summary-base").textContent = base
          ? base.name
          : "-";
        document.getElementById("summary-cpu").textContent = cpu
          ? cpu.name
          : "-";
        document.getElementById("summary-ram").textContent =
          ramItem ? ramItem.name : "-";
        document.getElementById("summary-storage").textContent =
          storageItems.map((item) => item.name).join(", ") || "-";
        document.getElementById("summary-keyboard").textContent = keyboard
          ? keyboard.name
          : "-";
        updateDiscountSummaryDisplay();
        document.getElementById("summary-total").textContent = money(total);
        const uzsWrap = document.getElementById("summary-total-uzs-wrap");
        const rate = readUsdRate();
        if (rate > 0) {
          uzsWrap.hidden = false;
          document.getElementById("summary-total-uzs").textContent =
            moneyUzs(total);
        } else {
          uzsWrap.hidden = true;
        }
      }

      function clearStatus() {
        const status = document.getElementById("status");
        status.textContent = "";
        status.classList.remove("error");
      }

      function clearSelections() {
        fillOptions(fields.base, [], "AIO tanlang", false, false);
        fillOptions(fields.ram, [], "RAM tanlang", false, false);
        fillOptions(
          fields.keyboardMouse,
          keyboardMouse,
          "Keyboard / Mouse",
          true,
          false,
        );

        fields.ram.value = "";
        fields.keyboardMouse.value = "";

        const storageContainer = document.getElementById("storage-slots");
        storageContainer.innerHTML = "";
        storageContainer.classList.remove("one-col", "two-cols", "three-cols");
        refreshSummary();
      }
      fillOptions(fields.cpu, cpus, "CPU tanlang", false, false);
      clearSelections();

      fields.cpu.addEventListener("change", () => {
        refreshForCpu();
        clearStatus();
      });
      fields.base.addEventListener("change", () => {
        const base = activeBase();
        if (base) {
          renderRamSelect(base);
          renderStorageSlots(base);
        }
        refreshSummary();
        clearStatus();
      });
      fields.ram.addEventListener("change", refreshSummary);
      fields.keyboardMouse.addEventListener("change", refreshSummary);

      discountInput.addEventListener("input", onDiscountEdited);
      discountInput.addEventListener("keyup", onDiscountEdited);
      discountInput.addEventListener("change", onDiscountEdited);
      discountInput.addEventListener("cut", onDiscountEdited);
      discountInput.addEventListener("paste", () => {
        requestAnimationFrame(onDiscountEdited);
      });

      function onUsdRateEdited() {
        refreshSummary();
        updateUsdRateSaveVisibility();
      }

      usdRateInput.addEventListener("input", onUsdRateEdited);
      usdRateInput.addEventListener("change", onUsdRateEdited);
      updateUsdRateSaveVisibility();

      document.getElementById("save-usd-rate").addEventListener("click", async () => {
        const rateStatus = document.getElementById("rate-status");
        const rate = parseUsdRateValue(usdRateInput.value);
        if (rate === null) {
          rateStatus.textContent = "Dollar kursini kiriting.";
          rateStatus.classList.add("error");
          return;
        }
        const body = new FormData();
        body.append("usd_rate", String(rate));
        body.append(
          "csrfmiddlewaretoken",
          document.querySelector("[name=csrfmiddlewaretoken]").value,
        );
        const response = await fetch("{% url 'calculator:save_usd_rate' %}", {
          method: "POST",
          body,
          headers: { "X-Requested-With": "XMLHttpRequest" },
        });
        const data = await response.json();
        if (response.ok) {
          const saved = setSavedUsdRate(data.usd_rate);
          usdRateInput.value = String(saved);
          rateStatus.textContent = "Dollar kursi saqlandi.";
          rateStatus.classList.remove("error");
          refreshSummary();
          updateUsdRateSaveVisibility();
        } else {
          rateStatus.textContent = data.error || "Saqlashda xatolik yuz berdi.";
          rateStatus.classList.add("error");
        }
      });

      document.getElementById("reset-form").addEventListener("click", () => {
        fields.cpu.value = "";
        discountInput.value = "";
        clearSelections();
        clearStatus();
        refreshSummary();
      });

      document
        .getElementById("save-quote")
        .addEventListener("click", async () => {
          const status = document.getElementById("status");
          const hasRam = fields.ram.value !== "";
          const hasStorage =
            selectedDynamic("storage_slots", maps.storage).length > 0;
          if (
            !fields.cpu.value ||
            !fields.base.value ||
            !hasRam ||
            !hasStorage
          ) {
            status.textContent =
              "CPU, AIO, RAM va kamida bitta SSD / HDD tanlang.";
            status.classList.add("error");
            return;
          }
          const body = new FormData(form);
          body.append("discount_percent", String(readDiscountPercent()));
          body.append("usd_rate", String(readUsdRate()));
          const response = await fetch("{% url 'calculator:save_quote' %}", {
            method: "POST",
            body,
            headers: { "X-Requested-With": "XMLHttpRequest" },
          });
          const data = await response.json();
          if (response.ok) {
            status.textContent = `Hisob-kitob #${data.id} saqlandi: $${data.total_price}`;
            status.classList.remove("error");
          } else {
            status.textContent = "Saqlashda xatolik yuz berdi.";
            status.classList.add("error");
          }
        });
    </script>
  </body>
</html>
